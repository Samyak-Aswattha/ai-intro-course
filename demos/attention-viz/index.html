<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>注意力热图实验室</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; padding:14px; gap:12px; overflow-y:auto; }
  .sent { display:flex; gap:6px; flex-wrap:wrap; }
  .tok { padding:7px 13px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); font-size:14.5px; cursor:pointer; transition:all .15s; }
  .tok.query { border-color:var(--accent); background:var(--accent-soft); font-weight:700; }
  .heat { flex:1; min-height:180px; border:1px solid var(--border); border-radius:12px; background:var(--surface); position:relative; overflow:auto; }
  table.ht { border-collapse:collapse; width:100%; font-size:13px; }
  table.ht th, table.ht td { border:1px solid var(--border); padding:7px 10px; text-align:center; position:relative; }
  table.ht th { background:var(--surface2); font-weight:600; }
  table.ht td .v { position:relative; z-index:2; font-family:var(--mono); font-size:11px; color:var(--text); }
  .formulabar { font-family:var(--mono); font-size:12px; color:var(--muted); background:var(--surface2); border-radius:8px; padding:8px 12px; }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">自注意力 · QKV 热图</span><span class="s">点击句子中的词作为 Query，看真实 softmax(QKᵀ) 权重——"it 指代什么"在热图里一目了然</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="sent" id="sent"></div>
    <div class="heat" id="heat"></div>
    <div class="formulabar" id="fbar">Attention(Q, K, V) = softmax(QKᵀ / √d) · V —— 选一个词做 Q，其余词做 K</div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">句子</div>
    <div class="tabs" id="sents"></div>
    <div class="break-zone" id="bz"><div class="bz-title">⚠ 故意弄坏它</div></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      权重 = Query 与每个 Key 的<b>相似度</b>经 softmax 归一。暖色 = 注意力强。<br><br>
      打开「去掉 √d 缩放」：点积过大使 softmax 饱和成"一家独大"，梯度消失——这个不起眼的除法是 Transformer 稳定的关键之一。
    </div>
  </div>
</div>
<script type="module">
import { brkSwitch } from '../_shared/demo.js';
const SENTENCES = [
  ['那只', '动物', '没有', '过马路', '因为', '它', '太', '累了'],
  ['我', '把', '手机', '放在', '桌上', '，', '它', '开始', '发烫'],
  ['学生们', '喜欢', '这门', '课', '因为', '它', '有', '意思'],
];
/* 每词 7 维手工语义向量（教学近似）。第 7 维是"指代对象标记"：只有「它」和它在各句里
   真正指代的名词（动物/手机/课）在这维上取值高，其余词很低——这维主导点积，
   保证「它」查询时排第一的确实是被指代的名词，而不是被其他词的向量模长带偏 */
const FEAT = {
  '那只': [.1,.2,.1,.2,.1,.3,.05], '动物': [.9,.1,.2,.1,.3,.4,3.0], '没有': [.1,.1,.1,.5,.2,.2,.05], '过马路': [.4,.3,.1,.3,.6,.2,.05],
  '因为': [.1,.1,.2,.4,.2,.3,.05], '它': [.4,.1,.2,.3,.5,.5,1.5], '太': [.1,.2,.1,.3,.2,.4,.05], '累了': [.5,.2,.3,.4,.8,.5,.05],
  '我': [.8,.1,.2,.1,.3,.3,.05], '把': [.1,.1,.1,.3,.2,.2,.05], '手机': [.3,.2,.7,.2,.5,.3,3.0], '放在': [.2,.3,.3,.3,.3,.2,.05],
  '桌上': [.2,.2,.5,.1,.3,.2,.05], '，': [.1,.1,.1,.1,.1,.1,.05], '开始': [.2,.2,.2,.5,.3,.3,.05], '发烫': [.5,.3,.7,.3,.6,.4,.05],
  '学生们': [.9,.2,.2,.2,.4,.4,.05], '喜欢': [.5,.2,.3,.3,.8,.6,.05], '这门': [.2,.1,.1,.3,.3,.3,.05], '课': [.4,.2,.3,.2,.5,.4,3.0],
  '有': [.1,.1,.1,.3,.2,.2,.05], '意思': [.4,.2,.3,.3,.7,.7,.05],
};
let si = 0, qi = 5, noScale = false;
function vec(w) { return FEAT[w] || [.3, .3, .3, .3, .3, .3, .05]; }
function attnScores(qi) {
  const sent = SENTENCES[si];
  const q = vec(sent[qi]);
  const d = q.length;
  const scores = sent.map((w, i) => {
    const k = vec(w);
    const dot = q.reduce((s, v, j) => s + v * k[j], 0);
    return noScale ? dot : dot / Math.sqrt(d);
  });
  /* softmax */
  const m = Math.max(...scores);
  const es = scores.map(s => Math.exp(s - m));
  const sum = es.reduce((a, b) => a + b, 0);
  return es.map(e => e / sum);
}
function render() {
  const sent = SENTENCES[si];
  const sentEl = document.getElementById('sent');
  sentEl.innerHTML = '';
  sent.forEach((w, i) => {
    const t = document.createElement('div');
    t.className = 'tok' + (i === qi ? ' query' : '');
    t.textContent = w;
    t.addEventListener('click', () => { qi = i; render(); });
    sentEl.append(t);
  });
  const scores = attnScores(qi);
  const heat = document.getElementById('heat');
  let html = '<table class="ht"><tr><th>Query ↓ / Key →</th>' + sent.map(w => `<th>${w}</th>`).join('') + '<th>Σ</th></tr>';
  html += '<tr><td><b>' + sent[qi] + '</b>（当前 Q）</td>' + scores.map((s, i) => {
    const a = s;
    const bg = `hsla(${(1 - a) * 210 + 10}, ${Math.min(90, 30 + a * 220)}%, ${78 - a * 38}%, ${0.25 + a * 0.75})`;
    return `<td style="background:${bg}"><span class="v">${(a * 100).toFixed(1)}%</span></td>`;
  }).join('') + '<td>100%</td></tr>';
  /* 全句热图（浅色） */
  html += '<tr><td style="height:4px;padding:0;background:var(--border)"></td>' + sent.map(() => '<td style="padding:0"></td>').join('') + '<td></td></tr>';
  sent.forEach((w, qIdx) => {
    const sc = attnScores(qIdx);
    html += `<tr><td style="font-size:11px;color:var(--muted)">${w}</td>` + sc.map((s, i) => {
      const a = s;
      const bg = `hsla(${(1 - a) * 210 + 10}, ${Math.min(90, 20 + a * 200)}%, ${80 - a * 30}%, ${0.12 + a * 0.55})`;
      return `<td style="background:${bg};font-size:10px;color:var(--muted)">${(a * 100).toFixed(0)}</td>`;
    }).join('') + '<td></td></tr>';
  });
  html += '</table>';
  heat.innerHTML = html;
  const top = scores.map((s, i) => ({ s, i })).sort((a, b) => b.s - a.s)[0];
  document.getElementById('fbar').innerHTML = `Query = 「<b style="color:var(--accent)">${sent[qi]}</b>」最关注 →「${sent[top.i]}」（${(top.s * 100).toFixed(1)}%）${noScale ? '　⚠ 未缩放：分布已接近 one-hot，梯度将消失' : ''}`;
}
const sentsEl = document.getElementById('sents');
SENTENCES.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = '句子' + (i + 1);
  if (!i) b.classList.add('on');
  b.addEventListener('click', () => {
    sentsEl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    si = i;
    const pron = s.indexOf('它');
    qi = pron >= 0 ? pron : Math.min(qi, s.length - 1);
    render();
  });
  sentsEl.append(b);
});
document.getElementById('bz').append(brkSwitch('去掉 √d 缩放', v => { noScale = v; render(); }));
render();
</script>
</body></html>
