<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>反向传播动画剧场</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .legend3 { position:absolute; left:12px; top:12px; font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; line-height:1.9; }
  .legend3 i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:5px; vertical-align:middle; }
</style></head><body>
<div class="demo-head"><span class="badge">动画剧场</span><span class="t">反向传播 · 四步循环</span><span class="s">单步观看：信号前向（蓝）→ 误差回传（红）→ 权重修正（黄）；开"梯度消失"看红光逐层熄灭</span></div>
<div class="demo-body">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend3">
      <div><i style="background:#4338ca"></i>前向信号</div>
      <div><i style="background:#dc2626"></i>反向梯度</div>
      <div><i style="background:#d97706"></i>权重修正脉冲</div>
    </div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">播放</div>
    <div class="btn-row">
      <button class="btn sm" id="play">播放一轮 ▶</button>
      <button class="btn sm ghost" id="step">单步 ⏭</button>
    </div>
    <div class="ctl"><label><span>网络深度</span><b id="lv"></b></label><input type="range" id="layers" min="3" max="8" value="4"></div>
    <div class="ctl"><label><span>播放速度</span><b id="sp"></b></label><input type="range" id="speed" min="1" max="10" value="6"></div>
    <div class="break-zone" id="bz"><div class="bz-title">⚠ 故意弄坏它</div></div>
    <div class="readout" id="ro">按「播放一轮」观看四步循环</div>
  </div>
</div>
<script type="module">
import { autoFit, brkSwitch } from '../_shared/demo.js';
const cv = document.getElementById('cv');
let ctx = autoFit(cv, draw);
let nLayers = 4, phase = 'idle', tPhase = 0, speed = 6, vanish = false, sig = [], grad = [];
let nodes = [];
function build() {
  nodes = [];
  for (let li = 0; li <= nLayers; li++) {
    const n = li === 0 ? 3 : (li === nLayers ? 1 : 3);
    const layer = [];
    for (let i = 0; i < n; i++) {
      layer.push({ x: 70 + li * ((W() - 130) / nLayers), y: H() / 2 + (i - (n - 1) / 2) * 74, act: 0, g: 0 });
    }
    nodes.push(layer);
  }
}
const W = () => cv.getBoundingClientRect().width, H = () => cv.getBoundingClientRect().height;
function draw() {
  ctx.clearRect(0, 0, W(), H());
  build();
  const b = cssv('--border'), muted = cssv('--muted');
  /* 连线 */
  for (let li = 0; li < nodes.length - 1; li++) {
    for (const a of nodes[li]) for (const c of nodes[li + 1]) {
      ctx.strokeStyle = b; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x + 14, a.y); ctx.lineTo(c.x - 14, c.y); ctx.stroke();
      /* 流动粒子 */
      drawFlow(a, c, li, 'fwd');
    }
  }
  /* 节点 */
  nodes.forEach((layer, li) => layer.forEach(n => {
    const act = n.act, g = n.g;
    const r = 13 + act * 5;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7);
    ctx.fillStyle = act > 0 ? `rgba(67,56,202,${0.25 + act * 0.65})` : cssv('--surface');
    ctx.fill();
    ctx.strokeStyle = g > 0.01 ? `rgba(220,38,38,${Math.min(1, 0.4 + g)})` : (b);
    ctx.lineWidth = g > 0.01 ? 2.5 : 1.5;
    ctx.stroke();
    if (g > 0.4 && phase === 'backward') {
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 4 + (1 - tPhase) * 8, 0, 7);
      ctx.strokeStyle = `rgba(220,38,38,${(tPhase) * 0.6})`;
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  }));
  /* 阶段标签 */
  const labels = { fwd: '① 前向传播：算出预测', loss: '② 计算损失', backward: '③ 反向传播：梯度回传', update: '④ 梯度下降：权重 −= lr·梯度', idle: '' };
  ctx.fillStyle = cssv('--accent');
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(labels[phase] || '', 16, 26);
}
function drawFlow(a, c, li, dir) {
  const f = tPhase;
  const t = dir === 'fwd' ? f : 1 - f;
  const x = a.x + (c.x - a.x) * t, y = a.y + (c.y - a.y) * t;
  const show = (phase === 'forward' && dir === 'fwd') || (phase === 'backward' && dir === 'bwd');
  if (!show) return;
  if (phase === 'backward') {
    const strength = vanish ? Math.pow(0.42, nodes.length - 1 - li) : 1;
    if (strength < 0.08) return;
    ctx.fillStyle = `rgba(220,38,38,${Math.min(1, strength)})`;
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(67,56,202,.9)';
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
  }
  if (phase === 'update') {
    const u = Math.abs(Math.sin(tPhase * 3 + li)) * 4;
    ctx.strokeStyle = 'rgba(217,119,6,.8)';
    ctx.lineWidth = u;
    ctx.beginPath(); ctx.moveTo(a.x + 14, a.y); ctx.lineTo(c.x - 14, c.y); ctx.stroke();
    ctx.lineWidth = 1;
  }
}
function cssv(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

let timer = null;
function runPhase() {
  const phases = ['forward', 'loss', 'backward', 'update'];
  let pi = 0;
  clearInterval(timer);
  phase = phases[0]; tPhase = 0;
  sig = nodes.map(l => l.map(() => Math.random()));
  timer = setInterval(() => {
    tPhase += 0.045 * (speed / 4);
    /* 更新节点显示 */
    if (phase === 'forward') {
      const li = Math.min(nodes.length - 1, Math.floor(tPhase * nodes.length));
      nodes.forEach((layer, l2) => layer.forEach((n, i) => n.act = l2 <= li ? sig[l2][i] : 0));
    }
    if (phase === 'backward') {
      const li = Math.floor((1 - tPhase) * (nodes.length - 1));
      nodes.forEach((layer, l2) => layer.forEach(n => n.g = l2 >= li ? (vanish ? Math.pow(0.42, l2) : 1) : 0));
    }
    if (phase === 'update') nodes.forEach(l => l.forEach(n => { n.g = 0.9; }));
    draw();
    if (tPhase >= 1) {
      tPhase = 0;
      pi++;
      if (pi >= phases.length) {
        clearInterval(timer);
        phase = 'idle';
        document.getElementById('ro').innerHTML = `✅ 一轮完成：前向 → 损失 → 反向 → 修正\n重复百万次 = 深度学习${vanish ? '\n⚠ 梯度消失模式：前层几乎收不到修正信号' : ''}`;
        nodes.forEach(l => l.forEach(n => { n.act = 0; n.g = 0; }));
        draw();
        return;
      }
      phase = phases[pi];
      document.getElementById('ro').textContent = ({ forward: '① 前向：数据流向输出', loss: '② 算损失', backward: '③ 反向：梯度往回走', update: '④ 每个权重朝"少错一点"微调' })[phase];
    }
  }, 30);
}
document.getElementById('play').addEventListener('click', runPhase);
document.getElementById('step').addEventListener('click', () => { clearInterval(timer); runPhase(); });
document.getElementById('layers').addEventListener('input', e => {
  nLayers = +e.target.value;
  document.getElementById('lv').textContent = nLayers;
  build(); draw();
});
document.getElementById('speed').addEventListener('input', e => { speed = +e.target.value; document.getElementById('sp').textContent = speed; });
document.getElementById('bz').append(brkSwitch('梯度消失模式（Sigmoid 网络深层）', v => { vanish = v; }));
document.getElementById('lv').textContent = '4';
document.getElementById('sp').textContent = '6';
draw();
</script>
</body></html>
