<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>走进中文屋</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; }
  .room { position:relative; width:min(560px, 92%); height:min(420px, 80%); border:3px solid var(--c3); border-radius:16px; background:var(--surface); }
  .room .lbl { position:absolute; top:-14px; left:24px; background:var(--bg); padding:2px 14px; font-size:13px; font-weight:700; color:var(--c3); letter-spacing:.2em; }
  .person { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); text-align:center; }
  .person .face { font-size:56px; }
  .person .cap { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .slot { position:absolute; width:150px; height:64px; display:flex; align-items:center; justify-content:center; }
  .slot.in { left:18px; top:50%; transform:translateY(-50%); border-right:3px dashed var(--border2); }
  .slot.out { right:18px; top:50%; transform:translateY(-50%); border-left:3px dashed var(--border2); }
  .slot .slb { position:absolute; top:-24px; font-size:11.5px; color:var(--muted); }
  .paper { padding:7px 12px; background:#fffce8; border:1px solid #d9cFA0; border-radius:8px; font-size:13px; box-shadow:0 3px 8px rgba(0,0,0,.12); color:#4a4326; max-width:140px; text-align:center; }
  [data-theme="dark"] .paper { background:#2c2817; color:#d9d0a8; border-color:#4b4436; }
  .book { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:11.5px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:4px 12px; background:var(--surface2); }
  .steps { position:absolute; top:14px; left:16px; right:16px; font-size:12px; color:var(--muted); line-height:1.6; }
  .steps b { color:var(--c3); }
</style></head><body>
<div class="demo-head"><span class="badge">互动剧场</span><span class="t">走进中文屋</span><span class="s">你扮演屋里那个不懂中文的规则执行者——亲手"查表"回答窗外的问题</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="room">
      <div class="lbl">中 文 屋</div>
      <div class="steps" id="steps">窗外递进来一张纸条…</div>
      <div class="slot in"><span class="slb">窗外递入</span><div class="paper" id="paperIn" style="visibility:hidden"></div></div>
      <div class="person"><div class="face">🧑‍🎓</div><div class="cap">你（只会英语）</div></div>
      <div class="slot out"><span class="slb">递出窗外</span><div class="paper" id="paperOut" style="visibility:hidden"></div></div>
      <div class="book">📕 规则手册：RULE-017…RULE-4436</div>
    </div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">一问一答</div>
    <div id="qbtns"></div>
    <div class="panel-title" style="margin-top:16px">复盘</div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      你刚才做的一切：<b>匹配符号 → 查表 → 组合 → 输出</b>。屋外的人以为屋里懂中文——但你确定自己一个字也不懂。<br><br>
      塞尔：这就是计算机的全部。<b>系统回应</b>：懂中文的是"你+手册+纸条"这个整体。你站哪边？
    </div>
  </div>
</div>
<script type="module">
const QA = [
  { q: '你会说中文吗？', table: 'RULE-88：见「会…吗」，先查词条「会」→ 输出模板：会 + 主题 + 的确', a: '会，中文的确会的。', thought: '你不知道"会"是什么意思，只知道规则让你抄这个模板。' },
  { q: '窗外的天气怎么样？', table: 'RULE-201：见「怎么样」→ 输出固定应答集 R3 中的任一句', a: '还不错，一切正常。', thought: '"天气"在你手里只是两个需要被规则匹配掉的符号。' },
  { q: '用"月亮"和"乡愁"写一句诗。', table: 'RULE-4102：见「写一句诗」→ 组合模板「X 在 Y 的 Z 里」', a: '月亮在乡愁的褶皱里。', thought: '组合出了一句漂亮的诗。但你不知道月亮，也不知道乡愁。' },
  { q: '你理解这些符号吗？', table: 'RULE-4396：见「理解…吗」→ 输出：理解 + 的（肯定模板）', a: '理解的。', thought: '最讽刺的一题：你"说"自己理解，靠的是完全不理解的动作。' },
];
const steps = document.getElementById('steps');
const inP = document.getElementById('paperIn'), outP = document.getElementById('paperOut');
const qbtns = document.getElementById('qbtns');
QA.forEach((item, i) => {
  const b = document.createElement('button');
  b.className = 'btn sm ghost';
  b.style.cssText = 'display:block;width:100%;margin-bottom:8px;text-align:left';
  b.textContent = `递交纸条 ${i + 1}：「${item.q}」`;
  b.addEventListener('click', () => play(i, b));
  qbtns.append(b);
});
let playing = false;
async function play(i, btn) {
  if (playing) return;
  playing = true;
  qbtns.querySelectorAll('button').forEach(b => b.disabled = true);
  const item = QA[i];
  inP.textContent = item.q; outP.textContent = '';
  inP.style.visibility = 'hidden'; outP.style.visibility = 'hidden';
  steps.innerHTML = '';
  await wait(400);
  inP.style.visibility = 'visible';
  steps.innerHTML = `📄 纸条递入：<b>「${item.q}」</b> —— 在你眼里这是一串<b>无法阅读的形状</b>`;
  await wait(1300);
  steps.innerHTML = `📖 翻手册… <b>${item.table}</b>`;
  await wait(1500);
  steps.innerHTML = `✍️ 按符号形状<b>誊写</b>（不是书写）回答…<div style="margin-top:4px;font-size:11.5px">💭 ${item.thought}</div>`;
  await wait(1200);
  outP.textContent = item.a;
  outP.style.visibility = 'visible';
  steps.innerHTML += `<div style="margin-top:6px">📤 递出。屋外人点头：「屋里的人中文真好。」——<b>但你懂中文吗？</b></div>`;
  btn.disabled = false; btn.textContent = `✅ 已答：「${item.q}」`;
  playing = false;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
</script>
</body></html>
