<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>决策树实验室</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; min-width:0; }
  .splitter { display:flex; width:100%; }
  .left { flex:1; position:relative; min-width:0; border-right:1px solid var(--border); }
  .right { width:46%; min-width:230px; overflow:auto; padding:10px; background:var(--surface2); }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .node { display:inline-block; background:var(--surface); border:1.5px solid var(--c2); border-radius:10px; padding:6px 10px; font-size:11.5px; font-family:var(--mono); margin:4px; line-height:1.5; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .node .ig { color:var(--c3); font-weight:700; }
  .node.leaf { border-color:var(--ok); }
  .tree-row { margin-bottom:2px; white-space:nowrap; }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">决策树 · 鸢尾花</span><span class="s">真实信息增益分裂 · 拖动最大深度看训练/测试分数的分叉点——那就是过拟合的起点</span></div>
<div class="demo-body">
  <div class="stage"><div class="splitter" style="height:100%">
    <div class="left"><canvas id="cv"></canvas></div>
    <div class="right" id="treeBox"><div style="font-size:12px;color:var(--muted);padding:6px">按「训练」长出一棵树</div></div>
  </div></div>
  <div class="demo-panel">
    <div class="panel-title">控制台</div>
    <div class="btn-row">
      <button class="btn sm" id="train">训练 ▶</button>
      <button class="btn sm ghost" id="mix">换一批数据</button>
    </div>
    <div id="ctls"></div>
    <div class="readout" id="ro"></div>
    <div class="break-zone" id="bz"><div class="bz-title">⚠ 故意弄坏它</div></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      鸢尾花数据（150 株 · 花瓣/萼片长宽 · 三类）。每次分裂选<b>信息增益最大</b>的特征与切点。<br><br>深度拉到 9：训练分 100%、测试分下降——树开始"背噪声"。打开「最小叶样本=1」更惨。
    </div>
  </div>
</div>
<script type="module">
import { autoFit, slider, brkSwitch, RNG, gauss } from '../_shared/demo.js';
/* 鸢尾花风格数据：3 类，2 维（花瓣长/宽） */
const CENTERS = [
  { m: [1.4, 0.25], s: [0.18, 0.08], name: '山鸢尾', c: '#0f766e' },
  { m: [4.3, 1.35], s: [0.48, 0.20], name: '变色鸢尾', c: '#b45309' },
  { m: [5.9, 2.05], s: [0.55, 0.27], name: '维吉尼亚', c: '#be185d' },
];
let data = [];
function gen() {
  const rng = RNG(Math.floor(Math.random() * 99999));
  data = [];
  CENTERS.forEach((cc, ci) => {
    for (let i = 0; i < 40; i++) data.push({ f: [gauss(rng, cc.m[0], cc.s[0]), gauss(rng, cc.m[1], cc.s[1])], y: ci });
  });
  /* 打乱并切 70/30 */
  data.sort(() => rng() - 0.5);
  data.forEach((d, i) => d.test = i % 10 >= 7);
}
gen();
/* 决策树（CART 风格：基尼） */
function gini(rows) {
  const n = rows.length; if (!n) return 0;
  const cnt = [0, 0, 0];
  rows.forEach(r => cnt[r.y]++);
  return 1 - cnt.reduce((a, c) => a + (c / n) ** 2, 0);
}
function bestSplit(rows, fi) {
  const vals = [...new Set(rows.map(r => r.f[fi]))].sort((a, b) => a - b);
  let best = null;
  for (let i = 0; i < vals.length - 1; i++) {
    const t = (vals[i] + vals[i + 1]) / 2;
    const L = rows.filter(r => r.f[fi] < t), R = rows.filter(r => r.f[fi] >= t);
    if (!L.length || !R.length) continue;
    const g = (L.length * gini(L) + R.length * gini(R)) / rows.length;
    if (!best || g < best.g) best = { t, g, L, R, fi };
  }
  return best;
}
function buildTree(rows, depth, maxDepth, minLeaf) {
  const g = gini(rows);
  const majority = rows.length ? rows[0].y : 0;
  const cnt = [0, 0, 0]; rows.forEach(r => cnt[r.y]++);
  const maj = cnt.indexOf(Math.max(...cnt));
  if (depth >= maxDepth || rows.length < minLeaf * 2 || g < 1e-4) return { leaf: true, cls: maj, n: rows.length };
  let best = null;
  for (let fi = 0; fi < 2; fi++) {
    const s = bestSplit(rows, fi);
    if (s && (!best || s.g < best.g)) best = { ...s, fi };
  }
  if (!best) return { leaf: true, cls: maj, n: rows.length };
  return { leaf: false, fi: best.fi, t: best.t, gain: g - best.g,
    L: buildTree(best.L, depth + 1, maxDepth, minLeaf), R: buildTree(best.R, depth + 1, maxDepth, minLeaf) };
}
function predict(tree, f) {
  let n = tree;
  while (!n.leaf) n = f[n.fi] < n.t ? n.L : n.R;
  return n.cls;
}
let maxDepth = 3, minLeaf = 5, tree = null;
const cv = document.getElementById('cv');
let ctx = autoFit(cv, draw);
function acc(tree) {
  let tr = [0, 0], te = [0, 0];
  data.forEach(d => {
    const p = predict(tree, d.f);
    const ok = p === d.y ? 1 : 0;
    if (d.test) { te[0] += ok; te[1]++; } else { tr[0] += ok; tr[1]++; }
  });
  return [tr[0] / Math.max(1, tr[1]), te[0] / Math.max(1, te[1])];
}
function draw() {
  const w = cv.getBoundingClientRect().width, h = cv.getBoundingClientRect().height;
  ctx.clearRect(0, 0, w, h);
  /* 坐标域：x 花瓣长 [0.5, 7.5]，y 花瓣宽 [0, 2.6] */
  const X = v => 36 + (v - 0.5) / 7 * (w - 56);
  const Y = v => h - 30 - v / 2.6 * (h - 56);
  /* 背景分类区 */
  if (tree) {
    for (let px = 0; px < w; px += 6) for (let py = 0; py < h; py += 6) {
      const fx = 0.5 + (px - 36) / (w - 56) * 7;
      const fy = (h - 30 - py) / (h - 56) * 2.6;
      const c = predict(tree, [fx, fy]);
      ctx.fillStyle = CENTERS[c].c + '18';
      ctx.fillRect(px, py, 6, 6);
    }
    /* 分裂线 */
    drawSplits(tree, 0, [0.5, 7.5], [0, 2.6]);
    function drawSplits(n, d, xr, yr) {
      if (n.leaf) return;
      ctx.strokeStyle = 'rgba(67,56,202,.5)';
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1.5;
      if (n.fi === 0) {
        ctx.beginPath(); ctx.moveTo(X(n.t), Y(yr[0])); ctx.lineTo(X(n.t), Y(yr[1])); ctx.stroke();
        drawSplits(n.L, d + 1, [xr[0], n.t], yr); drawSplits(n.R, d + 1, [n.t, xr[1]], yr);
      } else {
        ctx.beginPath(); ctx.moveTo(X(xr[0]), Y(n.t)); ctx.lineTo(X(xr[1]), Y(n.t)); ctx.stroke();
        drawSplits(n.L, d + 1, xr, [yr[0], n.t]); drawSplits(n.R, d + 1, xr, [n.t, yr[1]]);
      }
      ctx.setLineDash([]);
    }
  }
  /* 数据点 */
  data.forEach(d => {
    ctx.fillStyle = CENTERS[d.y].c;
    ctx.globalAlpha = d.test ? 1 : 0.85;
    ctx.beginPath();
    ctx.arc(X(d.f[0]), Y(d.f[1]), d.test ? 5 : 3.5, 0, 7);
    ctx.fill();
    if (d.test) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X(d.f[0]), Y(d.f[1]), 7.5, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  });
  ctx.fillStyle = cssv('--muted'); ctx.font = '11px sans-serif';
  ctx.fillText('花瓣长度 →', w - 90, h - 8);
  ctx.fillText('花瓣宽度 ↑', 6, 16);
}
function cssv(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function renderTree() {
  const box = document.getElementById('treeBox');
  if (!tree) { box.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px">按「训练」长出一棵树</div>'; return; }
  let html = '';
  function walk(n, d) {
    if (n.leaf) { html += `<span class="node leaf">🌿 ${CENTERS[n.cls].name}<br><span style="color:var(--muted)">${n.n} 株</span></span>`; return; }
    html += `<span class="node">❓ ${n.fi === 0 ? '花瓣长' : '花瓣宽'} &lt; ${n.t.toFixed(2)}<br><span class="ig">gain ${n.gain.toFixed(3)}</span></span><br>`;
    html += '<div style="padding-left:16px;border-left:1.5px dashed var(--border2)">';
    walk(n.L, d + 1);
    html += '<br>';
    walk(n.R, d + 1);
    html += '</div>';
  }
  walk(tree, 0);
  box.innerHTML = html;
}
function train() {
  tree = buildTree(data.filter(d => !d.test), 0, maxDepth, minLeaf);
  const [tr, te] = acc(tree);
  document.getElementById('ro').innerHTML = `树深度上限 <b>${maxDepth}</b>\n训练准确率 <b>${(tr * 100).toFixed(1)}%</b>\n测试准确率 <b>${(te * 100).toFixed(1)}%</b>${tr - te > 0.08 ? '\n⚠ 训练远高于测试：过拟合中' : ''}`;
  draw();
  renderTree();
}
document.getElementById('train').addEventListener('click', train);
document.getElementById('mix').addEventListener('click', () => { gen(); train(); });
const ctls = document.getElementById('ctls');
ctls.append(slider({ label: '最大深度', min: 1, max: 9, value: 3, onInput: v => { maxDepth = v; train(); } }));
document.getElementById('bz').append(brkSwitch('最小叶样本数 = 1（允许单株成叶）', v => { minLeaf = v ? 1 : 5; train(); }));
train();
</script>
</body></html>
