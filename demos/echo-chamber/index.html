<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>信息茧房模拟器</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; padding:14px; gap:12px; overflow-y:auto; }
  .feedwrap { display:flex; gap:14px; flex:1; min-height:0; }
  .feed { flex:1.5; border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .card2 { border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface2); display:flex; gap:10px; align-items:center; animation:slidein .3s; }
  @keyframes slidein { from { opacity:0; transform:translateY(8px);} }
  .card2 .ci { font-size:22px; }
  .card2 .ct { font-size:13px; font-weight:600; }
  .card2 .cs { font-size:11px; color:var(--muted); }
  .card2.extreme { border-color:var(--err); background:color-mix(in srgb, var(--err) 8%, var(--surface)); }
  .card2 .tag2 { margin-left:auto; font-size:10px; padding:2px 8px; border-radius:10px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .side2 { flex:1; display:flex; flex-direction:column; gap:10px; min-width:220px; }
  .interests { display:flex; flex-wrap:wrap; gap:6px; }
  .int { padding:5px 12px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface); font-size:12.5px; cursor:pointer; transition:all .15s; }
  .int.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .radar { border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:12px; flex:1; position:relative; }
  .radar .r-title { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .bars2 { display:flex; flex-direction:column; gap:6px; }
  .b2 { display:flex; align-items:center; gap:8px; font-size:12px; }
  .b2 .bl { width:64px; text-align:right; }
  .b2 .bt { flex:1; height:14px; border-radius:7px; background:var(--surface2); overflow:hidden; }
  .b2 .bf { height:100%; border-radius:7px; transition:width .5s; }
  .b2 .bv { width:40px; font-family:var(--mono); font-size:11px; color:var(--muted); }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">推荐算法 · 信息茧房模拟器</span><span class="s">选择你的兴趣，看算法如何一步步把你的世界收窄——优化目标只是"停留时长"</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="feedwrap">
      <div class="feed" id="feed"><div style="font-size:12.5px;color:var(--muted);text-align:center;padding:30px 0">选择右侧兴趣并按「刷新信息流」</div></div>
      <div class="side2">
        <div class="card2" style="flex-direction:column;align-items:stretch">
          <div style="font-size:12.5px;font-weight:700;margin-bottom:8px">你的兴趣（点击选择）</div>
          <div class="interests" id="ints"></div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn sm" id="refresh">刷新信息流 ▶</button>
            <button class="btn sm ghost" id="auto">连续刷 ▶</button>
          </div>
        </div>
        <div class="radar">
          <div class="r-title">你的"信息食谱"构成</div>
          <div class="bars2" id="bars"></div>
          <div class="r-title" style="margin-top:10px" id="cocoon"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">算法设定</div>
    <div class="break-zone" id="bz"><div class="bz-title">⚠ 改变优化目标</div></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      推荐算法看不到"你的成长"，只看到<b>点击与停留</b>。越极端的内容停留越久 → 越推越极端 → 兴趣谱越窄 → <b>茧房</b>。
    </div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      打开「多样性注入」：每 5 条强制 1 条圈外内容——茧房速度显著放缓。<b>这不是算法做不到，是商业模式没激励它这么做。</b>
    </div>
  </div>
</div>
<script type="module">
import { brkSwitch } from '../_shared/demo.js';
const CATS = [
  { k: 'tech', n: '科技数码', e: '📱', items: ['新手机评测', 'AI 又进化了', '芯片战争解读', '程序员的日常'] },
  { k: 'poem', n: '诗歌文学', e: '📖', items: ['一句宋词的力量', '当代诗十选', '博尔赫斯书单', '写作课笔记'] },
  { k: 'food', n: '美食', e: '🍜', items: ['食堂隐藏吃法', '一碗好面', '宿舍空气炸锅', '城市小吃地图'] },
  { k: 'fit', n: '健身', e: '💪', items: ['三分化训练', '减脂误区', '晨跑百日', '蛋白粉科普'] },
  { k: 'game', n: '游戏', e: '🎮', items: ['新游速报', '电竞名场面', '独立游戏安利', '速通纪录'] },
  { k: 'news', n: '时事财经', e: '📰', items: ['一周要闻', '市场复盘', '产业深度', '政策解读'] },
];
const EXTREME = { tech: '震惊！AI 将淘汰 90% 职业', poem: '文学已死？AI 三秒写出千古名句', food: '这种吃法正在毁掉你的胃', fit: '练错了会猝死！教练不会告诉你的事', game: '这款游戏毒害了一代人', news: '惊天内幕！他们不想让你知道' };
const picked = new Set(['tech']);
let rounds = 0, diversity = false, auto = false, timer = null;
const feed = document.getElementById('feed');
const ints = document.getElementById('ints');
CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'int' + (picked.has(c.k) ? ' on' : '');
  b.textContent = c.e + ' ' + c.n;
  b.dataset.k = c.k;
  b.addEventListener('click', () => {
    picked.has(c.k) ? picked.delete(c.k) : picked.add(c.k);
    b.classList.toggle('on', picked.has(c.k));
  });
  ints.append(b);
});
function refresh() {
  rounds++;
  const n = 4;
  for (let i = 0; i < n; i++) {
    /* 越刷越窄：后期 85% 概率只推已选类；越推越极端 */
    const narrow = Math.min(0.95, 0.4 + rounds * 0.06);
    let cat;
    if (diversity && i === 3) cat = CATS[Math.floor(Math.random() * CATS.length)];
    else if (Math.random() < narrow && picked.size) cat = [...CATS].filter(c => picked.has(c.k))[Math.floor(Math.random() * picked.size)];
    else cat = CATS[Math.floor(Math.random() * CATS.length)];
    const extremeP = diversity ? 0.12 : Math.min(0.6, 0.1 + rounds * 0.07);
    const isExtreme = Math.random() < extremeP;
    const title = isExtreme ? EXTREME[cat.k] : cat.items[Math.floor(Math.random() * cat.items.length)];
    const card = document.createElement('div');
    card.className = 'card2' + (isExtreme ? ' extreme' : '');
    card.innerHTML = `<span class="ci">${cat.e}</span><span><span class="ct">${title}</span><br><span class="cs">来自「${cat.n}」频道${isExtreme ? ' · 极端化标题' : ''}</span></span><span class="tag2">${picked.has(cat.k) ? '投其所好' : '圈外内容'}</span>`;
    card.querySelector('.tag2').style.display = diversity && !picked.has(cat.k) ? '' : (picked.has(cat.k) ? '' : 'none');
    feed.prepend(card);
  }
  while (feed.children.length > 18) feed.lastChild.remove();
  updBars();
}
function updBars() {
  /* 统计当前信息流构成 */
  const counts = {};
  feed.querySelectorAll('.card2').forEach(c => {
    const k = c.querySelector('.cs').textContent.match(/「(.+?)」/)?.[1];
    counts[k] = (counts[k] || 0) + 1;
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  const colors = ['#0f766e', '#4338ca', '#b45309', '#be185d', '#b4482b', '#0e7490'];
  document.getElementById('bars').innerHTML = Object.entries(counts).map(([k, v], i) => `
    <div class="b2"><span class="bl">${k.slice(0, 4)}</span><div class="bt"><div class="bf" style="width:${v / total * 100}%;background:${colors[i % 6]}"></div></div><span class="bv">${Math.round(v / total * 100)}%</span></div>`).join('');
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const extremes = feed.querySelectorAll('.card2.extreme').length;
  const cocoonN = top ? Math.round(top[1] / total * 100) : 0;
  document.getElementById('cocoon').innerHTML = cocoonN > 60
    ? `🧠 <b style="color:var(--err)">茧房指数：${cocoonN}%</b>（单一主题占比）· 极端内容 ${extremes} 条`
    : `🧩 信息多样：最大主题占比 ${cocoonN}% · 极端内容 ${extremes} 条`;
}
document.getElementById('refresh').addEventListener('click', refresh);
document.getElementById('auto').addEventListener('click', e => {
  auto = !auto;
  e.target.textContent = auto ? '停止 ■' : '连续刷 ▶';
  if (auto) timer = setInterval(refresh, 1400);
  else clearInterval(timer);
});
document.getElementById('bz').append(brkSwitch('注入多样性（每 4 条 1 条圈外）', v => { diversity = v; }));
refresh();
</script>
</body></html>
