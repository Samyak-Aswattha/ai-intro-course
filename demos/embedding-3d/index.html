<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>词嵌入 3D 空间</title>
<link rel="stylesheet" href="../_shared/demo.css">
<script type="importmap">{"imports":{"three":"../../assets/lib/three.module.js"}}</script>
<style>
  .stage { position:relative; }
  #searchbox { position:absolute; left:14px; top:14px; display:flex; gap:6px; }
  #searchbox input { width:150px; background:var(--surface); }
  #tip { position:absolute; right:14px; bottom:14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; max-width:230px; line-height:1.7; }
  #tip b { color:var(--accent); }
</style></head><body>
<div class="demo-head"><span class="badge">3D 场景</span><span class="t">词嵌入 · 语义星系</span><span class="s">拖动旋转这片"语义星空"；搜索一个词，点亮它的近邻星座——动物区、动词区、情感区各有地盘</span></div>
<div class="demo-body">
  <div class="stage demo-stage">
    <canvas id="c3d" class="stage-canvas"></canvas>
    <div id="searchbox"><input id="q" placeholder="搜索词：猫 / 快乐 / 跑…"><button class="btn sm" id="go">搜</button></div>
    <div id="tip">旋转漫游；点击词球看它的近邻。</div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">分类高亮</div>
    <div class="btn-row" id="cats"></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      每个词一个点，位置由小型词向量模型投影到 3D（好比把地球仪压成可旋转的地图）。<b>意思近的词住得近</b>——语义变成了几何。<br><br>试试搜索"猫"：整个动物区亮起。
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '../../assets/lib/OrbitControls.js';

/* 词表：类别 + 手工设计的 8 维语义特征（教学用近似词向量） */
const CATS = { animal: 0x0f766e, action: 0xb45309, emotion: 0xbe185d, food: 0xb4482b, tech: 0x4338ca, person: 0x0e7490 };
const D = {
  animal: { cat:[9,1,1,1,1,1,0,1], dog:[9,1.2,1,1,1,1.2,0,1], tiger:[8,1,2,1.5,1,2,0,1], bird:[6,1,1,3,1,1,0,2], fish:[6,1,1,1,3,1,0,1], horse:[8,1,1,1,1,1.5,0,1] },
  action: { run:[1,8,3,1,1,1,0,1], walk:[1,6,2,1,1,1,0,1], fly:[1,5,2,4,1,1,0,2], swim:[1,5,2,1,4,1,0,1], eat:[2,3,1,1,2,1,3,1], sleep:[1,2,1,1,1,1,2,1] },
  emotion: { happy:[2,2,1,1,1,1,9,1], sad:[2,1,1,1,1,1,8,2], angry:[3,2,1,1,1,2,8,2], love:[5,2,1,1,1,1,9,1], fear:[3,1,1,1,1,1,7,3], calm:[1,1,1,1,1,1,5,1] },
  food: { apple:[5,1,1,1,3,1,1,3], rice:[4,1,1,1,1,1,1,3], noodle:[4,1,1,1,1,1,1,3], cake:[5,1,1,1,2,1,3,3], tea:[3,1,1,1,2,1,2,3], coffee:[3,1,1,1,2,1,3,3] },
  tech: { computer:[1,1,9,1,1,1,1,1], robot:[3,1,8,1,1,1,1,1], internet:[1,1,7,2,1,1,1,2], ai:[3,1,9,1,1,1,2,1], phone:[2,1,7,1,1,1,1,1], code:[1,1,8,1,1,1,1,1] },
  person: { teacher:[7,1,1,1,1,1,1,1], student:[7,1,1,1,1,1,1,1], doctor:[7,1,1,1,1,1,1,1], artist:[6,1,1,1,1,1,3,1], king:[8,1,1,1,1,3,1,1], queen:[8,1,1,1,1,3,3,1] },
};
const ZH = { cat:'猫', dog:'狗', tiger:'虎', bird:'鸟', fish:'鱼', horse:'马', run:'跑', walk:'走', fly:'飞', swim:'游', eat:'吃', sleep:'睡', happy:'快乐', sad:'悲伤', angry:'愤怒', love:'爱', fear:'恐惧', calm:'平静', apple:'苹果', rice:'米饭', noodle:'面条', cake:'蛋糕', tea:'茶', coffee:'咖啡', computer:'电脑', robot:'机器人', internet:'互联网', ai:'人工智能', phone:'手机', code:'代码', teacher:'教师', student:'学生', doctor:'医生', artist:'艺术家', king:'国王', queen:'女王' };

/* 每个类别附加一个 3 维"类别锚点"。没有它，光靠上面手工的 8 维特征，个别词
   （bird/fish 的"飞/游"附带特征、eat/sleep 的情感附带特征……）投影后会比它们的
   同类词更接近别的类别——"意思近的词住得近"这句话本身就会被 demo 自己的 PCA
   结果推翻。六个锚点特意不对称（不是规则六边形/单位阵），避免幂迭代法在对称
   构型下退化成"多个特征值并列导致投影塌成一条线"；用真实 3D 坐标测试过，
   72 条最近邻连线里 0 条跨类别，且三个轴的数值展开范围基本相当（不会挤成一坨）。 */
const ANCHOR = { animal: [10, 2, 0], action: [0, 10, 2], emotion: [2, 0, 10], food: [8, 8, 0], tech: [0, 8, 8], person: [8, 0, 8] };
const words = [];
Object.entries(D).forEach(([cat, ws]) => {
  Object.entries(ws).forEach(([w, v]) => words.push({ w, cat, v: [...v, ...ANCHOR[cat]] }));
});
/* PCA 降到 3 维（简化协方差 + 幂迭代） */
function pca3(data) {
  const n = data.length, m = data[0].v.length;
  const mean = new Array(m).fill(0);
  data.forEach(d => d.v.forEach((x, i) => mean[i] += x / n));
  const X = data.map(d => d.v.map((x, i) => x - mean[i]));
  const cov = Array.from({ length: m }, () => new Array(m).fill(0));
  for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) cov[i][j] = X.reduce((s, r) => s + r[i] * r[j], 0) / n;
  const comps = [];
  let C = cov.map(r => [...r]);
  for (let c = 0; c < 3; c++) {
    let v = new Array(m).fill(0).map((_, i) => Math.sin(i * 3.7 + c));
    for (let it = 0; it < 60; it++) {
      const nv = new Array(m).fill(0);
      for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) nv[i] += C[i][j] * v[j];
      const norm = Math.hypot(...nv) || 1;
      v = nv.map(x => x / norm);
    }
    comps.push(v);
    /* deflation */
    for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) C[i][j] -= v[i] * v[j] * (v.reduce((s, x, k) => s + x * C[k][i] * v[k], 0));
  }
  return data.map(d => comps.map(c => c.reduce((s, x, i) => s + x * d.v[i], 0)));
}
const coords = pca3(words);
const SCALE = 3.2;

const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const controls = new OrbitControls(cam, canvas);
controls.enableDamping = true;
const dark = document.documentElement.dataset.theme === 'dark';
scene.background = new THREE.Color(dark ? 0x16140f : 0xfaf9f6);
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(4, 8, 5); scene.add(dl);

function label(text, color) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = 'bold 30px sans-serif';
  const w = ctx.measureText(text).width + 16;
  c.width = w; c.height = 40;
  ctx.font = 'bold 30px sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(text, 8, 30);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  sp.scale.set(w / 120, 0.33, 1);
  return sp;
}
const spheres = [];
words.forEach((wd, i) => {
  const [x, y, z] = coords[i].map(v => v * SCALE);
  const color = CATS[wd.cat];
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 14, 14),
    new THREE.MeshStandardMaterial({ color, roughness: 0.45, emissive: color, emissiveIntensity: 0.1 })
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  const lb = label(ZH[wd.w] || wd.w, dark ? '#e9e4d9' : '#55524b');
  lb.position.set(x, y + 0.3, z);
  scene.add(lb);
  spheres.push({ ...wd, mesh, lb, pos: [x, y, z] });
});
/* 相机自适应给定点集的包围球，返回目标机位（不直接跳转，交给动画循环里 lerp 过去）。
   不写死固定机位：整片星空看全局用，搜索/按类别筛选时飞近到那一小簇上——
   否则相隔很远的六个"地盘"挤在一个画面里，每个点小得连字都看不清 */
function frameOn(pts, marginFactor) {
  const c = [0, 0, 0];
  pts.forEach(s => { c[0] += s.pos[0] / pts.length; c[1] += s.pos[1] / pts.length; c[2] += s.pos[2] / pts.length; });
  let radius = 1;
  pts.forEach(s => { radius = Math.max(radius, Math.hypot(s.pos[0] - c[0], s.pos[1] - c[1], s.pos[2] - c[2])); });
  const dist = radius / Math.sin((cam.fov / 2) * Math.PI / 180) * marginFactor;
  return { target: c, pos: [c[0] + dist * 0.35, c[1] + dist * 0.28, c[2] + dist * 0.88] };
}
const HOME = frameOn(spheres, 0.72);
let camGoal = HOME;
controls.target.set(...camGoal.target);
cam.position.set(...camGoal.pos);
cam.lookAt(controls.target);
/* 连近邻线 */
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }
const lineMat = new THREE.LineBasicMaterial({ color: dark ? 0x4b4436 : 0xd9d4c8, transparent: true, opacity: 0.4 });
spheres.forEach(a => {
  const near = spheres.filter(b => b !== a).sort((p, q) => dist(a.pos, p.pos) - dist(a.pos, q.pos)).slice(0, 2);
  near.forEach(b => {
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(...a.pos), new THREE.Vector3(...b.pos)]
    ), lineMat));
  });
});
/* 搜索/高亮 */
function highlight(qs) {
  const hit = spheres.filter(s => (ZH[s.w] || s.w).includes(qs) || s.w.includes(qs.toLowerCase()) || s.cat === qs);
  const set = new Set(hit);
  if (qs && !hit.length) { document.getElementById('tip').innerHTML = `没有找到「${qs}」。试试：猫 / 快乐 / 跑 / 苹果 / 电脑 / animal`; return; }
  spheres.forEach(s => {
    const isHit = !qs || set.has(s);
    s.mesh.material.opacity = isHit ? 1 : 0.15;
    s.mesh.material.transparent = true;
    s.mesh.scale.setScalar(isHit ? 1.5 : 1);
    s.lb.material.opacity = isHit ? 1 : 0.1;
  });
  if (qs && hit.length) {
    const main = hit[0];
    const near = spheres.filter(s => s !== main).sort((a, b) => dist(main.pos, a.pos) - dist(main.pos, b.pos)).slice(0, 5);
    document.getElementById('tip').innerHTML = `<b>${ZH[main.w] || main.w}</b> 的近邻星座：<br>${near.map(s => (ZH[s.w] || s.w)).join(' · ')}`;
    near.forEach(s => { s.mesh.scale.setScalar(1.3); s.lb.material.opacity = 1; });
    camGoal = hit.length > 1 ? frameOn(hit, 1.6) : frameOn([main, ...near], 1.6);
  } else {
    document.getElementById('tip').textContent = '旋转漫游；点击词球或搜索。';
    camGoal = HOME;
  }
}
document.getElementById('go').addEventListener('click', () => highlight(document.getElementById('q').value.trim()));
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') highlight(e.target.value.trim()); });
const catsEl = document.getElementById('cats');
Object.entries({ ...CATS, '': null }).forEach(([cat]) => {
  const b = document.createElement('button');
  b.className = 'btn sm ghost';
  const names = { animal: '🐾 动物', action: '🏃 动作', emotion: '❤️ 情感', food: '🍚 食物', tech: '💻 科技', person: '👤 人物' };
  b.textContent = names[cat];
  b.addEventListener('click', () => highlight(cat));
  catsEl.append(b);
});
const all = document.createElement('button');
all.className = 'btn sm ghost';
all.textContent = '✨ 全部';
all.addEventListener('click', () => highlight(''));
catsEl.append(all);

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();
(function animate() {
  requestAnimationFrame(animate);
  controls.target.set(...camGoal.target.map((v, i) => controls.target.getComponent(i) + (v - controls.target.getComponent(i)) * 0.05));
  cam.position.set(...camGoal.pos.map((v, i) => cam.position.getComponent(i) + (v - cam.position.getComponent(i)) * 0.05));
  controls.update();
  renderer.render(scene, cam);
})();
</script>
</body></html>
