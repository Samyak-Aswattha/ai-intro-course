<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>K-means 舞台</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">K-means 聚类舞台</span><span class="s">点击撒点或选预设形状，单步/连续运行四步循环；换月牙形数据看它翻车</span></div>
<div class="demo-body">
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="demo-panel">
    <div class="panel-title">数据</div>
    <div class="btn-row">
      <button class="btn sm ghost" data-d="blobs">团块</button>
      <button class="btn sm ghost" data-d="moons">月牙</button>
      <button class="btn sm ghost" data-d="ring">圆环</button>
      <button class="btn sm ghost" id="clear">清空</button>
    </div>
    <div class="panel-title">算法</div>
    <div class="btn-row">
      <button class="btn sm" id="run">连续运行 ▶</button>
      <button class="btn sm ghost" id="step">单步 ⏭</button>
      <button class="btn sm ghost" id="reseeds">重撒中心</button>
    </div>
    <div id="ctls"></div>
    <div class="readout" id="ro"></div>
    <div class="break-zone" id="bz"><div class="bz-title">⚠ 故意弄坏它</div></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      四步循环：<b>撒中心 → 归属 → 移中心 → 收敛</b>。目标函数是簇内距离平方和。<br><br>
      月牙/圆环数据上它会"横切"——K-means 只认球形团块。这不是 bug，是世界观。
    </div>
  </div>
</div>
<script type="module">
import { autoFit, slider, brkSwitch, RNG, gauss, PALETTE } from '../_shared/demo.js';
const cv = document.getElementById('cv');
let ctx = autoFit(cv, draw);
let pts = [], cents = [], k = 3, iter = 0, running = false, raf = 0, phase = 'assign';
const W = () => cv.getBoundingClientRect().width, H = () => cv.getBoundingClientRect().height;

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  pts.push({ x: e.clientX - r.left, y: e.clientY - r.top, c: -1 });
  draw();
  updRO();
});
function seedCents() {
  cents = [];
  const rng = RNG(Date.now() % 99999);
  for (let i = 0; i < k; i++) cents.push({ x: rng() * W(), y: rng() * H(), c: i });
  iter = 0;
}
function assign() {
  let moved = 0;
  pts.forEach(p => {
    let best = 0, bd = Infinity;
    cents.forEach((c, i) => {
      const d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    if (p.c !== best) moved++;
    p.c = best;
  });
  return moved;
}
function moveCents() {
  cents.forEach((c, i) => {
    const mine = pts.filter(p => p.c === i);
    if (mine.length) { c.x = mine.reduce((a, p) => a + p.x, 0) / mine.length; c.y = mine.reduce((a, p) => a + p.y, 0) / mine.length; }
  });
}
function inertia() {
  return pts.reduce((a, p) => {
    const c = cents[p.c] || cents[0];
    return a + (p.x - c.x) ** 2 + (p.y - c.y) ** 2;
  }, 0);
}
function step() {
  const moved = assign();
  moveCents();
  iter++;
  updRO();
  return moved;
}
function draw() {
  ctx.clearRect(0, 0, W(), H());
  /* 簇染色 */
  const clusters = new Set(pts.map(p => p.c));
  pts.forEach(p => {
    ctx.fillStyle = PALETTE[p.c % PALETTE.length] + 'cc';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 7); ctx.fill();
  });
  /* 中心 */
  cents.forEach((c, i) => {
    ctx.strokeStyle = PALETTE[i % PALETTE.length];
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(c.x - 11, c.y); ctx.lineTo(c.x + 11, c.y);
    ctx.moveTo(c.x, c.y - 11); ctx.lineTo(c.x, c.y + 11);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.font = '11px sans-serif';
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fillText('C' + (i + 1), c.x + 13, c.y - 10);
  });
}
function updRO() {
  document.getElementById('ro').innerHTML = `迭代 <b>${iter}</b>　簇内距离平方和 <b>${Math.round(inertia())}</b>\n点数 ${pts.length}　k = ${k}`;
}
function loop() {
  if (!running) return;
  const moved = step();
  draw();
  if (moved === 0) { running = false; document.getElementById('run').textContent = '连续运行 ▶'; document.getElementById('ro').innerHTML += '\n✅ 已收敛（无点换簇）'; return; }
  raf = requestAnimationFrame(loop);
}
document.getElementById('run').addEventListener('click', () => {
  running = !running;
  document.getElementById('run').textContent = running ? '暂停 ■' : '连续运行 ▶';
  if (running) loop();
});
document.getElementById('step').addEventListener('click', () => { step(); draw(); });
document.getElementById('reseeds').addEventListener('click', () => { seedCents(); draw(); updRO(); });
document.getElementById('clear').addEventListener('click', () => { pts = []; cents = []; draw(); updRO(); });
document.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
  const rng = RNG(Math.floor(Math.random() * 9999));
  pts = [];
  const type = b.dataset.d;
  if (type === 'blobs') {
    [[0.28, 0.35], [0.65, 0.3], [0.5, 0.72]].forEach(c => {
      for (let i = 0; i < 32; i++) pts.push({ x: W() * c[0] + gauss(rng, 0, 46), y: H() * c[1] + gauss(rng, 0, 40), c: -1 });
    });
  } else if (type === 'moons') {
    for (let i = 0; i < 45; i++) {
      const t = Math.PI * (i / 44);
      pts.push({ x: W() * 0.28 + Math.cos(t) * W() * 0.2 + gauss(rng, 0, 16), y: H() * 0.35 - Math.sin(t) * H() * 0.22 + gauss(rng, 0, 16), c: -1 });
      pts.push({ x: W() * 0.32 + Math.cos(t + Math.PI) * W() * 0.2 + gauss(rng, 0, 16), y: H() * 0.42 - Math.sin(t + Math.PI) * H() * 0.22 + gauss(rng, 0, 16), c: -1 });
    }
  } else if (type === 'ring') {
    for (let i = 0; i < 60; i++) {
      const t = i / 60 * Math.PI * 2;
      pts.push({ x: W() / 2 + Math.cos(t) * W() * 0.28 + gauss(rng, 0, 12), y: H() / 2 + Math.sin(t) * H() * 0.3 + gauss(rng, 0, 12), c: -1 });
    }
    for (let i = 0; i < 25; i++) pts.push({ x: W() / 2 + gauss(rng, 0, 30), y: H() / 2 + gauss(rng, 0, 30), c: -1 });
  }
  seedCents();
  draw(); updRO();
}));
const ctls = document.getElementById('ctls');
ctls.append(slider({ label: 'k（簇数）', min: 1, max: 6, value: 3, onInput: v => { k = v; seedCents(); draw(); updRO(); } }));
document.getElementById('bz').append(brkSwitch('k=1（全部一团）', v => { if (v) { k = 1; } else { k = 3; } seedCents(); draw(); updRO(); }));
draw(); updRO();
</script>
</body></html>
