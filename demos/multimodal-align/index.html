<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>多模态对齐观测站</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; gap:14px; padding:16px; overflow-y:auto; }
  .querybox { display:flex; gap:8px; }
  .querybox input { flex:1; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; }
  .item { border:1.5px solid var(--border); border-radius:12px; background:var(--surface); padding:8px; text-align:center; position:relative; overflow: hidden; }
  .item .emoji { font-size:38px; display:block; margin:6px 0; }
  .item .nm { font-size:12px; color:var(--muted); }
  .item .score { position:absolute; top:6px; right:8px; font-family:var(--mono); font-size:11px; color:var(--accent); font-weight:700; }
  .item.hit { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .item.hit::after { content:"✓"; position:absolute; top:4px; left:8px; color:var(--ok); font-weight:900; }
  .pairbox { min-height:64px; border:1.5px dashed var(--c3); border-radius:12px; padding:12px 16px; font-size:14px; background:var(--surface2); }
  .pairbox b { color:var(--c3); }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">CLIP · 图文对齐观测站</span><span class="s">输入文字看它在图库中检索；反向选图生成描述——对比"已对齐/未对齐"两种空间的差异</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="querybox">
      <input id="q" placeholder="输入描述，如：一只猫 / 交通工具 / 圆形的东西 / 快乐的动物" value="一只猫">
      <button class="btn" id="go">检索 ▶</button>
    </div>
    <div class="gallery" id="gal"></div>
    <div class="pairbox" id="pair">点一张图，看它最匹配的文字描述（反向检索）。</div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">空间</div>
    <div class="tabs" id="modes"></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      <b>已对齐</b>：CLIP 式——文字与图像嵌入同一空间，"一只猫"的向量天然落在猫照片旁边。<br>
      <b>未对齐</b>：两个空间各自为政，检索近似随机——对齐本身才是多模态智能的核心魔法。
    </div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      训练目标只有一句话：<b>配对的图文拉近，不配对的推远</b>。四亿对网络图文训练后，零样本检索就涌现了。
    </div>
  </div>
</div>
<script type="module">
/* 图库：每图一个手工 8 维语义向量 */
const ITEMS = [
  { e: '🐱', n: '猫', v: [9,1,1,2,1,1,1,1] }, { e: '🐶', n: '狗', v: [9,1,1,2,1,2,1,1] }, { e: '🐦', n: '鸟', v: [6,1,1,8,1,1,1,2] },
  { e: '🐟', n: '鱼', v: [6,1,1,1,8,1,1,1] }, { e: '🚗', n: '汽车', v: [1,1,1,1,1,1,9,4] }, { e: '🚌', n: '公交车', v: [1,1,1,1,1,1,9,5] },
  { e: '🚲', n: '自行车', v: [1,7,1,1,1,1,8,2] }, { e: '🍕', n: '披萨', v: [1,1,6,1,3,1,1,8] }, { e: '🍎', n: '苹果', v: [4,1,7,1,3,1,1,6] },
  { e: '🏀', n: '篮球', v: [1,6,8,1,1,1,1,3] }, { e: '🌕', n: '月亮', v: [1,1,9,2,1,1,1,1] }, { e: '😊', n: '笑脸', v: [3,2,2,1,1,8,1,2] },
  { e: '🏠', n: '房子', v: [1,1,1,1,1,1,6,2] }, { e: '🌷', n: '花', v: [3,1,7,1,2,4,1,4] }, { e: '🎹', n: '钢琴', v: [1,1,1,1,1,3,6,8] },
  { e: '📚', n: '书', v: [2,1,1,1,1,2,2,3] }, { e: '🦁', n: '狮子', v: [9,2,2,2,1,3,1,1] }, { e: '🎡', n: '摩天轮', v: [1,1,8,1,1,3,5,2] },
];
const TEXTS = {
  '一只猫': [9,1,1,2,1,1,1,1], '猫': [9,1,1,2,1,1,1,1], '狗': [9,1,1,2,1,2,1,1],
  '一只狗': [9,1,1,2,1,2,1,1], '鸟': [6,1,1,8,1,1,1,2], '鱼': [6,1,1,1,8,1,1,1],
  '交通工具': [1,1,1,1,1,1,9,4], '汽车': [1,1,1,1,1,1,9,4], '食物': [2,1,6,1,3,1,1,7],
  '圆形的东西': [2,2,7,1,2,1,2,3], '快乐的动物': [7,2,2,3,1,5,1,1], '乐器': [1,1,1,1,1,3,6,8],
  '天空中的': [1,1,8,2,1,1,1,1], '房子': [1,1,1,1,1,1,6,2], '花': [3,1,7,1,2,4,1,4],
  '球类运动': [1,6,8,1,1,1,1,3], '书': [2,1,1,1,1,2,2,3], '狮子': [9,2,2,2,1,3,1,1],
};
let aligned = true;
function textVec(q) {
  if (TEXTS[q]) return TEXTS[q];
  /* 组合近似：关键词加权 */
  let v = new Array(8).fill(0), matched = false;
  for (const [k, tv] of Object.entries(TEXTS)) {
    if (q.includes(k)) { matched = true; v = v.map((x, i) => x + tv[i]); }
  }
  return matched ? v.map(x => x / 3) : new Array(8).fill(1);
}
function cos(a, b) {
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] ** 2; nb += b[i] ** 2; }
  return d / Math.sqrt(na * nb + 1e-9);
}
const rng = (() => { let s = 42; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function search(q) {
  const tv = textVec(q);
  const scored = ITEMS.map(it => {
    let s;
    if (aligned) s = cos(tv, it.v);
    else s = 0.55 + rng() * 0.35;  /* 未对齐：近似随机 */
    return { ...it, s };
  });
  scored.sort((a, b) => b.s - a.s);
  render(scored);
}
function render(scored) {
  const gal = document.getElementById('gal');
  gal.innerHTML = '';
  const mx = scored[0].s;
  scored.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i < 3 ? ' hit' : '');
    d.innerHTML = `<span class="score">${(it.s * 100).toFixed(0)}</span><span class="emoji">${it.e}</span><span class="nm">${it.n}</span>`;
    d.addEventListener('click', () => reverse(it));
    gal.append(d);
  });
}
function reverse(it) {
  let best = null;
  if (aligned) {
    best = Object.entries(TEXTS).map(([t, v]) => ({ t, s: cos(it.v, v) })).sort((a, b) => b.s - a.s).filter(x => x.s > 0.85)[0];
  } else {
    const keys = Object.keys(TEXTS);
    best = { t: keys[Math.floor(rng() * keys.length)], s: 0.5 + rng() * 0.4 };
  }
  document.getElementById('pair').innerHTML = `反向检索：这张图（${it.e} ${it.n}）最匹配的描述是 <b>「${best.t}」</b>（相似度 ${(best.s * 100).toFixed(0)}%）${aligned ? '' : ' — 未对齐空间里这只是碰运气'}`;
}
document.getElementById('go').addEventListener('click', () => search(document.getElementById('q').value.trim() || '一只猫'));
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(e.target.value.trim()); });
const modesEl = document.getElementById('modes');
[['aligned', '已对齐空间（CLIP 式）'], ['raw', '未对齐（两个空间）']].forEach(([k, n], i) => {
  const b = document.createElement('button');
  b.textContent = n;
  if (!i) b.classList.add('on');
  b.addEventListener('click', () => {
    modesEl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    aligned = k === 'aligned';
    search(document.getElementById('q').value.trim() || '一只猫');
  });
  modesEl.append(b);
});
search('一只猫');
</script>
</body></html>
