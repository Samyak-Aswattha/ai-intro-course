<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>训练实操台</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; padding:14px; gap:12px; overflow-y:auto; }
  .tasks { display:flex; flex-direction:column; gap:10px; }
  .task { border:1.5px solid var(--border); border-radius:12px; background:var(--surface); padding:14px 16px; transition:all .2s; }
  .task.done { border-color:var(--ok); background:linear-gradient(0deg, var(--ok-soft,#dcf0e2) 40%, var(--surface)); }
  .task .tk-h { display:flex; align-items:center; gap:10px; }
  .task .tk-h .no { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .task .tk-h .name { font-weight:700; font-size:14px; flex:1; }
  .task .tk-h .st { font-size:12px; font-weight:700; }
  .task .desc { font-size:12.5px; color:var(--muted); line-height:1.7; margin-top:6px; }
  .task .actions { display:flex; gap:8px; margin-top:8px; }
  .iframebox { flex:2; min-height:380px; border:1px solid var(--border); border-radius:12px; overflow: hidden; background:#fff; position: relative; }
  .iframebox iframe { width:100%; height:100%; border:0; }
  .srctabs { display:flex; gap:6px; }
  .srctabs button { padding:5px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--muted); cursor:pointer; font-family:var(--font); }
  .srctabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; background:var(--accent-soft); }
  .live { font-family:var(--mono); font-size:12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; line-height:1.8; }
  .live .stale { color:var(--muted); }
</style></head><body>
<div class="demo-head"><span class="badge">实操台</span><span class="t">神经网络训练五张任务卡</span><span class="s">右侧就是真实跑在你浏览器里的训练模拟器——它的实时状态会同步显示在下面，不是自己说了算的勾选清单</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="tasks" id="tasks"></div>
    <div class="srctabs">
      <button class="on" data-src="local">🎮 本站 MLP 操场（离线，与下方读数联动）</button>
      <button data-src="tfp">🌐 TensorFlow Playground（谷歌官方，需联网）</button>
    </div>
    <div class="iframebox" id="ifbox"><iframe id="mlpFrame" src="../mlp-playground/" loading="lazy"></iframe></div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">实时读数（来自右侧模拟器）</div>
    <div class="live" id="live">尚未收到数据——在右侧调整参数或点「训练」。</div>
    <div class="panel-title" style="margin-top:12px">进度</div>
    <div class="readout" id="ro"></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      完成全部五张卡，你就亲手复现了第四章全部概念：欠拟合、过拟合、学习率、深宽对比、控制变量。
    </div>
  </div>
</div>
<script type="module">
const TASKS = [
  { n: '看见欠拟合', desc: '数据选「螺旋」；网络设为 1 层 × 2 神经元；训练至稳定。观察：决策边界拉不直，训练/测试损失都高。记下两个损失值。', hint: '预期结果：测试损失停在 0.5 以上——模型容量不够。' },
  { n: '看见过拟合', desc: '同数据加到 4 层 × 8 神经元，关掉正则化。观察测试损失先降后升。然后开 L2 或 Dropout，看它"退烧"。', hint: '预期：训练损失趋近 0，测试损失回升 >0.15——它在背噪声。' },
  { n: '学习率灾难', desc: '把学习率拉到最大（本站操场可到 3.0）。看损失曲线瞬间爆表。降回 0.05，恢复正常。', hint: '预期：损失变 NaN 或天文数字——下山步子跨过了山谷。' },
  { n: '深 vs 宽', desc: '固定大约相同的参数量：构型 A = 1 层 × 16；构型 B = 4 层 × 4。同数据对比测试准确率。', hint: '预期：深层通常更快达到同样精度——层间复用更省参数。' },
  { n: '你的控制变量实验', desc: '自选一个变量（噪声 / 激活函数 / 批大小），固定其他条件跑两轮，写 100 字对比结论——这是本章作业素材。', hint: '作业提交：变量、设置、两个结果、一句结论。' },
];
const KEY = 'aic:playground-tasks';
let done = JSON.parse(localStorage.getItem(KEY) || '[]');
function render() {
  const box = document.getElementById('tasks');
  box.innerHTML = '';
  TASKS.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'task' + (done.includes(i) ? ' done' : '');
    d.innerHTML = `<div class="tk-h"><span class="no">TASK 0${i + 1}</span><span class="name">${t.n}</span>
      <span class="st" style="color:${done.includes(i) ? 'var(--ok)' : 'var(--muted)'}">${done.includes(i) ? '✓ 已完成' : '未完成'}</span></div>
      <div class="desc">${t.desc}<br><span style="color:var(--c3)">${t.hint}</span></div>
      <div class="actions">${done.includes(i)
        ? `<button class="btn sm ghost" data-undone="${i}">取消完成</button>`
        : `<button class="btn sm" data-done="${i}">✓ 完成了</button>`}</div>`;
    box.append(d);
  });
  box.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => { done.push(+b.dataset.done); save(); }));
  box.querySelectorAll('[data-undone]').forEach(b => b.addEventListener('click', () => { done = done.filter(x => x !== +b.dataset.undone); save(); }));
  document.getElementById('ro').innerHTML = `已完成 <b>${done.length} / ${TASKS.length}</b>${done.length === TASKS.length ? '\n🏆 全部完成！第四章实操毕业' : ''}`;
}
function save() { localStorage.setItem(KEY, JSON.stringify(done)); render(); }

const TFP_SRC = 'https://playground.tensorflow.org/#activation=tanh&batchSize=10&dataset=spiral&regDataset=reg-plane&learningRate=0.03&regularizationRate=0&noise=0&networkShape=4,2&seed=0.5&showTestData=false&discretize=false&percTrainData=50&x=true&y=true&xTimesY=false&xSquared=false&ySquared=false&cosX=false&sinX=false&cosY=false&sinY=false&collectStats=false&problem=classification&initZero=false&hideText=false';
document.querySelectorAll('.srctabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.srctabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const ifbox = document.getElementById('ifbox');
  if (b.dataset.src === 'local') {
    ifbox.innerHTML = '<iframe id="mlpFrame" src="../mlp-playground/" loading="lazy"></iframe>';
  } else {
    ifbox.innerHTML = `<iframe src="${TFP_SRC}" loading="lazy"></iframe>`;
    document.getElementById('live').innerHTML = '<span class="stale">TensorFlow Playground 是独立站点，读数不联动——回到「本站 MLP 操场」可恢复实时读数。</span>';
  }
}));

/* 本站 MLP 操场是同源 iframe，会把训练状态 postMessage 过来——这样这个"任务清单"
   页面才算是真的连着一个在跑的模拟器，而不是一份自己打勾的作业单 */
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'aic-mlp-state') return;
  const s = e.data;
  const trained = isFinite(s.trainLoss);
  document.getElementById('live').innerHTML =
    `网络：<b>${s.layers} 层 × ${s.neuronsPerLayer} 神经元</b>${s.noAct ? '（无激活）' : ''}　激活：${s.act}\n` +
    `学习率：<b>${s.lr.toFixed(2)}</b>　L2：${s.l2.toFixed(3)}　数据：${s.dataType}\n` +
    (trained
      ? `epoch ${s.epoch}　训练损失 <b>${s.trainLoss.toFixed(3)}</b>　测试损失 <b>${s.testLoss.toFixed(3)}</b>　准确率 <b>${(s.acc * 100).toFixed(0)}%</b>`
      : `<span class="stale">还没开始训练——点右侧「训练 ▶」</span>`);
});

render();
</script>
</body></html>
