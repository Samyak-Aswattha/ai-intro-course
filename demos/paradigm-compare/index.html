<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>同一任务，三种范式</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; padding:16px; gap:12px; overflow-y:auto; }
  .trial { display:flex; align-items:center; gap:14px; padding:12px 16px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  .trial .fruit { font-size:30px; }
  .trial .feat { font-size:12.5px; color:var(--muted); line-height:1.6; }
  .trial .feat b { color:var(--text); }
  .verdict { padding:8px 14px; border-radius:10px; font-size:13.5px; font-weight:600; margin-left:auto; white-space:nowrap; }
  .verdict.good { background:var(--ok); color:#fff; }
  .verdict.bad { background:var(--err); color:#fff; }
  .arena { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:4px; }
  .lane { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--surface2); }
  .lane h4 { margin:0 0 8px; font-size:13px; color:var(--c3); }
  .lane .out { font-family:var(--mono); font-size:12px; line-height:1.8; color:var(--text); min-height:100px; }
  .lane .score { margin-top:8px; font-size:12px; color:var(--muted); }
  .lane.win { border-color:var(--ok); box-shadow:0 0 0 2px rgba(21,128,61,.15); }
</style></head><body>
<div class="demo-head"><span class="badge">互动</span><span class="t">同一任务，三种范式</span><span class="s">任务：判断水果"能否入菜"。三条路线：规则（符号）、权重（连接）、奖惩（行为）</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="arena" id="arena">
      <div class="lane" id="laneS"><h4>📜 符号主义 · 写规则</h4><div class="out" id="outS"></div><div class="score" id="scS"></div></div>
      <div class="lane" id="laneC"><h4>🧠 连接主义 · 学权重</h4><div class="out" id="outC"></div><div class="score" id="scC"></div></div>
      <div class="lane" id="laneB"><h4>🎮 行为主义 · 试错</h4><div class="out" id="outB"></div><div class="score" id="scB"></div></div>
    </div>
    <div id="trials"></div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">运行</div>
    <div class="btn-row">
      <button class="btn sm" id="run">放入一批水果 ▶</button>
      <button class="btn sm ghost" id="reset">重置</button>
    </div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      <b style="color:var(--text)">符号路线</b>：人工规则"甜且结实 → 可入菜"。遇到例外（草莓甜但不结实）就翻车——<b>规则写不穷世界</b>。<br>
      <b style="color:var(--text)">连接路线</b>：从 12 个带标签样本学两维权重，10 轮梯度下降后自动找到分界。<br>
      <b style="color:var(--text)">行为路线</b>：没有标签！只拿"奖励"（答对 +1），像吃角子老虎机一样探索，慢慢逼近正确策略。
    </div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8">
      三种路线都"学会"了任务，但成本结构完全不同：<b>符号</b>贵在知识获取、<b>连接</b>贵在数据、<b>行为</b>贵在试错次数。当代大模型 = 三者的合体。
    </div>
  </div>
</div>
<script type="module">
import { RNG } from '../_shared/demo.js';
/* 水果数据：[甜度0-1, 结实度0-1, 可入菜] */
const FRUITS = [
  { n: '苹果', e: '🍎', f: [0.8, 0.9], y: 1 }, { n: '梨', e: '🍐', f: [0.7, 0.8], y: 1 },
  { n: '菠萝', e: '🍍', f: [0.7, 0.95], y: 1 }, { n: '柠檬', e: '🍋', f: [0.2, 0.8], y: 1 },
  { n: '草莓', e: '🍓', f: [0.9, 0.15], y: 0 }, { n: '葡萄', e: '🍇', f: [0.85, 0.1], y: 0 },
  { n: '桃子', e: '🍑', f: [0.9, 0.4], y: 0 }, { n: '西瓜', e: '🍉', f: [0.95, 0.5], y: 0 },
  { n: '芒果', e: '🥭', f: [0.9, 0.45], y: 0 }, { n: '山楂', e: '🔴', f: [0.3, 0.85], y: 1 },
  { n: '香蕉', e: '🍌', f: [0.9, 0.3], y: 0 }, { n: '椰子', e: '🥥', f: [0.4, 1.0], y: 1 },
];
const trialsEl = document.getElementById('trials');
let w = [0, 0], b = 0, q = { s: 0, st: 0, n: 1, eps: 0.35, w: [0.5, 0.5] }, logS = [], logC = [], logB = [], sS = 0, sC = 0, sB = 0, total = 0;

const SYMBOL_RULE = f => (f[0] >= 0.55 && f[1] >= 0.6) ? 1 : 0;   // 人工规则
function connPredict(f) { return (w[0] * f[0] + w[1] * f[1] + b) >= 0.5 ? 1 : 0; }
function behPredict(f) {
  // ε-贪心：多数按当前权重，偶尔探索
  const s = q.w[0] * f[0] + q.w[1] * f[1];
  if (Math.random() < q.eps) return Math.random() < 0.5 ? 1 : 0;
  return s >= 0.5 ? 1 : 0;
}
function trainConn(f, y) {
  const p = 1 / (1 + Math.exp(-(w[0] * f[0] + w[1] * f[1] + b)));
  const lr = 0.3;
  w[0] += lr * (y - p) * f[0]; w[1] += lr * (y - p) * f[1]; b += lr * (y - p) * 0.5;
}
function trainBeh(f, y, pred) {
  const r = pred === y ? 1 : -1;
  const lr = 0.25 * r * (1 - q.eps);
  q.w[0] = Math.max(0, q.w[0] + lr * f[0]); q.w[1] = Math.max(0, q.w[1] + lr * f[1]);
  q.n++; q.eps = Math.max(0.05, 0.35 / Math.sqrt(q.n));
}
document.getElementById('run').addEventListener('click', () => runRound(4));
document.getElementById('reset').addEventListener('click', () => {
  w = [0, 0]; b = 0; q = { s: 0, st: 0, n: 1, eps: 0.35, w: [0.5, 0.5] };
  logS = []; logC = []; logB = []; sS = sC = sB = total = 0;
  trialsEl.innerHTML = ''; updLanes();
});
function runRound(n) {
  for (let k = 0; k < n; k++) {
    const idx = Math.floor(Math.random() * FRUITS.length);
    const { n: name, e, f, y } = FRUITS[idx];
    const pS = SYMBOL_RULE(f);
    const pC = connPredict(f);
    const pB = behPredict(f);
    trainConn(f, y); trainBeh(f, y, pB);
    total++; if (pS === y) sS++; if (pC === y) sC++; if (pB === y) sB++;
    logS.push(`${e}${pS === y ? '✓' : '✗'}`); logC.push(`${e}${pC === y ? '✓' : '✗'}`); logB.push(`${e}${pB === y ? '✓' : '✗'}`);
    if (logS.length > 26) { logS.shift(); logC.shift(); logB.shift(); }
    const row = document.createElement('div');
    row.className = 'trial';
    row.innerHTML = `<span class="fruit">${e}</span>
      <span class="feat"><b>${name}</b>｜甜度 ${f[0].toFixed(2)} · 结实 ${f[1].toFixed(2)}<br>标准答案：${y ? '可入菜' : '不适'}</span>
      <span class="verdict ${pS === y ? 'good' : 'bad'}">规则 ${pS === y ? '✓' : '✗'}</span>
      <span class="verdict ${pC === y ? 'good' : 'bad'}">网络 ${pC === y ? '✓' : '✗'}</span>
      <span class="verdict ${pB === y ? 'good' : 'bad'}">试错 ${pB === y ? '✓' : '✗'}</span>`;
    trialsEl.prepend(row);
  }
  updLanes();
}
function updLanes() {
  document.getElementById('outS').innerHTML = logS.join(' ') || '等待运行…';
  document.getElementById('outC').innerHTML = logC.join(' ') || '等待运行…';
  document.getElementById('outB').innerHTML = logB.join(' ') || '等待运行…';
  document.getElementById('scS').textContent = `正确率 ${sS}/${total}`;
  document.getElementById('scC').textContent = `正确率 ${sC}/${total}　权重 w=[${w.map(v => v.toFixed(2)).join(', ')}]`;
  document.getElementById('scB').textContent = `正确率 ${sB}/${total}　探索率 ${q.eps.toFixed(2)}`;
  ['S', 'C', 'B'].forEach(k => document.getElementById('lane' + k).classList.remove('win'));
  const best = sS >= sC && sS >= sB ? 'S' : sC >= sB ? 'C' : 'B';
  if (total > 0) document.getElementById('lane' + best).classList.add('win');
}
updLanes();
</script>
</body></html>
