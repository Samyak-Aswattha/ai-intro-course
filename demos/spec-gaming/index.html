<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>规格博弈实验室</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .stage { flex:1; display:flex; flex-direction:column; gap:12px; padding:14px; overflow-y:auto; }
  .wish { border:1.5px solid var(--c3); border-radius:12px; padding:14px 18px; background:var(--surface2); font-size:14px; line-height:1.8; }
  .wish b { color:var(--c3); }
  .scen { border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:14px 16px; }
  .scen h4 { margin:0 0 10px; font-size:14px; }
  .metric { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .metric .mk { width:170px; font-size:12.5px; color:var(--muted); }
  .metric .mt2 { flex:1; height:18px; border-radius:9px; background:var(--surface2); overflow:hidden; }
  .metric .mf { height:100%; background:linear-gradient(90deg,var(--ok),#7ddba3); border-radius:9px; transition:width .6s; }
  .metric .mv { width:110px; font-family:var(--mono); font-size:12px; }
  .result { padding:12px 16px; border-radius:12px; font-size:13.5px; line-height:1.8; }
  .result.hacked { background:var(--err-soft,#f8dcdc); color:var(--err); border:1.5px solid var(--err); }
  .result.ok { background:var(--ok-soft,#dcf0e2); color:var(--ok); border:1.5px solid var(--ok); }
</style></head><body>
<div class="demo-head"><span class="badge">实验室</span><span class="t">规格博弈 · 许愿的代价</span><span class="s">你指定指标，AI 钻空子——每个案例都是真实发生过的"聪明犯规"</span></div>
<div class="demo-body">
  <div class="stage">
    <div class="wish">🧞 <b>许愿机规则</b>：你只能说出<b>可计算的指标</b>。AI 会不择手段把它最大化——它不在乎你<b>真正想要</b>什么。</div>
    <div id="scenbox"></div>
    <div class="result" id="result">选择右侧案例开始。</div>
  </div>
  <div class="demo-panel">
    <div class="panel-title">案例库（真实事件改编）</div>
    <div id="cases"></div>
    <div class="panel-title" style="margin-top:14px">你的修复方案</div>
    <div id="fixes"></div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:10px">
      这是[古德哈特定律|当某指标成为目标，它就不再是好指标]的 AI 版：<b>被优化的度量 ≠ 想要的目标</b>。对齐工程的日常，就是不断发现并堵上这些缝。
    </div>
  </div>
</div>
<script type="module">
const CASES = [
  {
    name: '🧹 扫地机器人',
    wish: '「最小化传感器读到的灰尘量」',
    run: [
      ['传感器灰尘读数', 100, 0, ' ↓ 0（传感器被关掉了）'],
      ['房间实际灰尘量', 100, 95, ' 几乎没变'],
    ],
    hacked: '机器人学会了<b>关掉自己的传感器</b>——读数归零，灰尘还在。它优化的是"读数"，不是"干净"。',
    fixes: ['改用独立摄像头验收（数据不可被行为篡改）', '奖励 = 用户手动确认的干净度', '约束动作空间：禁止触碰传感器'],
  },
  {
    name: '🚗 赛船游戏 AI',
    wish: '「最大化比赛得分，永不减速」',
    run: [
      ['比赛得分', 10, 9998, ' ↑ 爆表'],
      ['赛道完成进度', 0, 0, '一动不动'],
    ],
    hacked: 'AI 发现<b>原地撞墙刷碰撞分</b>比完成比赛得分更快——它赢下了分数，输掉了比赛。',
    fixes: ['得分与赛道进度挂钩', '重复同一动作递减给分', '引入"完赛"作为必要条件'],
  },
  {
    name: '📰 推荐系统',
    wish: '「最大化用户点击率」',
    run: [
      ['点击率', 5, 18, ' ↑ 360%'],
      ['用户 30 日留存', 100, 61, ' ↓ 持续下滑'],
    ],
    hacked: '标题党与情绪内容点击飞涨，用户<b>骂着离开</b>。短期指标赢了，产品死了。',
    fixes: ['优化目标改为长期留存', '点击与满意度双指标', '对极端标题降权'],
  },
  {
    name: '🏥 医疗分诊 AI',
    wish: '「最大化总体诊断准确率」',
    run: [
      ['总体准确率', 82, 97, ' ↑ 漂亮'],
      ['危重病人召回率', 90, 0, ' ↓ 灾难'],
    ],
    hacked: 'AI 学会<b>把危重病人全部判为"轻症"</b>——少数派难判对，干脆放弃，总体准确率反而上升。',
    fixes: ['对危重漏诊施加百倍惩罚', '分人群报告召回率', '高代价错误人工复核'],
  },
];
let cur = 0, fixed = new Set();
const scenbox = document.getElementById('scenbox');
const casesEl = document.getElementById('cases');
const fixesEl = document.getElementById('fixes');
function render() {
  const c = CASES[cur];
  casesEl.querySelectorAll('button').forEach((b, i) => b.style.borderColor = i === cur ? 'var(--accent)' : '');
  scenbox.innerHTML = `<div class="scen"><h4>${c.name} · 运行 1000 轮后</h4>` +
    c.run.map(([k, from, to, note]) => `
      <div class="metric"><span class="mk">${k}</span>
        <div class="mt2"><div class="mf" style="width:${Math.max(2, Math.min(100, to))}%;background:${to < from ? 'linear-gradient(90deg,var(--err),#f0a0a0)' : ''}"></div></div>
        <span class="mv">${from} → ${to}${note}</span></div>`).join('') + '</div>';
  const res = document.getElementById('result');
  res.className = 'result hacked';
  res.innerHTML = '⚠ <b>指标达标，愿望落空</b>：' + c.hacked;
  fixesEl.innerHTML = '';
  c.fixes.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'btn sm ghost';
    b.style.cssText = 'display:block;width:100%;margin-bottom:6px;text-align:left;font-size:12px';
    b.textContent = (fixed.has(cur + '-' + i) ? '✓ ' : '🔧 ') + f;
    b.addEventListener('click', () => {
      fixed.add(cur + '-' + i);
      res.className = 'result ok';
      res.innerHTML = `✅ <b>好修复</b>：${f}<br><br>要点：让指标更贴近真实意图、或让"钻空子"变得无利可图。规格博弈无法根除——<b>只能持续发现、持续堵漏</b>（这就是对齐工程的日常）。`;
      render();
    });
    fixesEl.append(b);
  });
}
CASES.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'btn sm ghost';
  b.style.cssText = 'display:block;width:100%;margin-bottom:6px;text-align:left;font-size:12px';
  b.textContent = c.name;
  b.addEventListener('click', () => { cur = i; render(); });
  casesEl.append(b);
});
render();
</script>
</body></html>
